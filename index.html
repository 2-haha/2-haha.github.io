<!DOCTYPE html>
<html>
<head>
  <title>☆マイホームページへようこそ☆</title>
  <style>
    body {
      background-color: #ffccff; /* ピンクの背景 */
      background-image: url('https://i.imgur.com/abc123.gif'); /* キラキラGIF背景 */
      font-family: "MS Pゴシック", sans-serif;
      color: #0000ff; /* 青い文字 */
      text-align: center;
    }
    table {
      border: 2px solid #ff00ff; /* ピンクの枠 */
      background-color: #ffffff;
      margin: auto;
    }
    h1 {
      color: #ff0000; /* 赤い見出し */
      text-shadow: 2px 2px #ffff00; /* 黄色の影 */
    }
    .blink {
      animation: blink 1s infinite; /* 点滅 */
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    img {
      border: 3px double #00ff00; /* 緑のダブル枠 */
    }
    /* 年齢確認ポップアップのスタイル */
    #ageGate {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8); /* 半透明黒背景 */
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #ageGate div {
      background-color: #ffccff;
      border: 3px solid #ff00ff;
      padding: 20px;
      text-align: center;
      font-family: "MS Pゴシック", sans-serif;
    }
    #ageGate button {
      background-color: #00ff00;
      color: #ff0000;
      border: 2px solid #ff00ff;
      padding: 10px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    #ageGate button:hover {
      background-color: #ffff00;
    }
  </style>
</head>
<body>
  <!-- 年齢確認ポップアップ -->
  <div id="ageGate">
    <div>
      <h2>☆ このサイトはR-18です ☆</h2>
      <p>あなたは18歳以上ですか？</p>
      <button onclick="enterSite()">はい！(*^_^*)</button>
      <button onclick="window.location.href='https://www.google.com/search?q=%E7%AB%B9%E6%9B%B8%E6%88%BF'">いいえ…(T_T)</button>
    </div>
  </div>

  <!-- メインコンテンツ（最初は隠す） -->
  <div id="mainContent" style="display: none;">
    <table width="600" cellpadding="10">
      <tr>
        <td>
          <h1 class="blink">☆★ ようこそ！[あなたの名前]のホームページ ★☆</h1>
          <p>2000年代のキラキラワールドへ！(^^)d</p>
          <!-- キラキラGIF -->
          <img src="https://i.imgur.com/xyz789.gif" alt="キラキラ">
          <p>☆ 訪問者数: <img src="https://www.free-counter.jp/sample/sample_1.gif" alt="カウンター"></p>
          <p><b>最終更新: 2025/8/21</b></p>
          <hr>
          <!-- メニュー -->
          <p>
            <a href="#about">自己紹介</a> | 
            <a href="#links">リンク集</a> | 
            <a href="#guestbook">ゲストブック</a>
          </p>
          <hr>
          <!-- コンテンツ -->
          <h2 id="about">★ 自己紹介 ★</h2>
          <p>こんにちは！[あなたの名前]だよ！趣味は[趣味]！よろしくね～(*^_^*)</p>
          <!-- MIDI音楽（ブラウザ制限あり） -->
          <embed src="https://example.com/sample.mid" hidden="true" autostart="true" loop="true">
          <h2 id="links">★ リンク集 ★</h2>
          <p>
            <a href="https://example.com">お気に入りのサイト</a><br>
            <a href="https://example.com">かっこいいサイト</a>
          </p>
          <h2 id="guestbook">★ ゲストブック ★</h2>
          <p>コメント残してくれると嬉しいな！(*^▽^*)</p>
          <!-- シンプルなフォーム（仮） -->
          <form>
            <input type="text" placeholder="名前"><br>
            <textarea placeholder="コメント書いてね！"></textarea><br>
            <input type="submit" value="送信！">
          </form>
        </td>
      </tr>
    </table>
    <p><marquee>☆★ キラキラ～！また来てね～！ ★☆</marquee></p>
  </div>

  <script>
    function enterSite() {
      document.getElementById('ageGate').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
    }
    function leaveSite() {
      window.location.href = 'https://www.google.com'; // いいえで飛ぶ先（例: Google）
    }
  </script>
</body>
</html>
