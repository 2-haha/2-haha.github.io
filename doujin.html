<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>2はは 同人サークル</title>
  <style>
    /* 全体設定 */
    body {
        background-color: #e6eeff; /* 背景色 */
        margin: 0;
        padding: 20px 0;
        font-family: "MS Pゴシック", sans-serif;
    }

    /* サイト全体の幅と枠線 */
    #wrapper {
        width: 800px;
        margin: 0 auto;
        background-color: #ffffff;
        border: 2px solid #6688cc;
        padding: 10px;
        box-sizing: border-box;
    }

    /* 1. ヘッダーエリア */
    #header {
        width: 100%;
        margin-bottom: 15px;
        text-align: center;
    }
    #header img {
        width: 100%;
        height: auto;
        display: block;
    }

    /* 2. 中間エリア（リンク＋メインコンテンツを横並び） */
    #contents-area {
        display: flex;
        gap: 15px; /* リンクとメインの間のすき間 */
        margin-bottom: 15px;
    }

    /* 左：リンクエリア */
    #sidebar {
        width: 200px;
        background-color: #f0f4fb;
        border: 1px solid #99bbdd;
        padding: 10px;
        box-sizing: border-box;
    }
    #sidebar h3 {
        font-size: 14px;
        color: #335599;
        margin-top: 0;
        border-bottom: 1px dashed #99bbdd;
        padding-bottom: 5px;
    }
    #sidebar ul {
        list-style: none;
        padding-left: 0;
        margin: 0;
    }
    #sidebar li {
        margin-bottom: 8px;
    }
    #sidebar a {
        color: #003399;
        text-decoration: none;
        font-size: 13px;
    }
    #sidebar a:hover {
        text-decoration: underline;
        color: #ff0055;
    }

    /* 右：メインコンテンツ（最新情報＋イラスト） */
    #main {
        width: 555px;
        border: 1px solid #99bbdd;
        padding: 15px;
        box-sizing: border-box;
        background-color: #ffffff;
    }

    /* 最新情報ボックス */
    .news-box {
        border: 1px solid #6688cc;
        background-color: #fdfdfd;
        margin-bottom: 15px;
    }
    .news-title {
        background-color: #88aadd;
        color: #ffffff;
        font-weight: bold;
        padding: 5px 10px;
        font-size: 14px;
    }
    .news-body {
        padding: 10px;
        font-size: 13px;
        height: 100px;
        overflow-y: scroll; /* 2000年代風スクロール枠 */
    }

    /* イラスト表示エリア */
    .gallery-box {
        text-align: center;
        border: 1px dashed #aaccee;
        padding: 15px;
        background-color: #fafafa;
    }
    .gallery-box img {
        max-width: 100%;
        height: auto;
        border: 1px solid #ccc;
    }

    /* 3. バナーエリア（フッター） */
    #footer-banner {
        border-top: 2px solid #6688cc;
        padding-top: 15px;
        text-align: center;
        font-size: 12px;
    }
    .banner-space {
        margin-bottom: 10px;
    }
  </style>
</head>
<body>

    <div id="wrapper">

        <!-- 【1】ヘッダー -->
        <div id="header">
            <a href="index.html">
                <!-- 画像のパスは環境に合わせて修正してください -->
                <img src="images/header.png" alt="2はは ヘッダー">
            </a>
        </div>

        <!-- 【2】中間エリア（リンク ＋ メイン） -->
        <div id="contents-area">
            
            <!-- 左：リンク -->
            <div id="sidebar">
                <h3>♥ LINK ♥</h3>
                <ul>
                    <li><a href="index.html">トップ</a></li>
                    <li><a href="about.html">サークル紹介</a></li>
                    <li><a href="works.html">同人誌情報</a></li>
                    <li><a href="blog.html">近況報告</a></li>
                </ul>
            </div>

            <!-- 右：メイン（最新情報 ＋ イラストとか） -->
            <div id="main">
                
                <!-- 最新情報枠 -->
                <div class="news-box">
                    <div class="news-title">最新情報</div>
                    <div class="news-body">
                        2026/09/08 サイト開設しました！<br>
                        2026/09/01 新刊の作業を進めています。<br>
                        2026/08/15 イベントご参加ありがとうございました！
                    </div>
                </div>

                <!-- イラストとかエリア -->
                <div class="gallery-box">
                    <p style="margin-top:0; font-weight:bold; color:#555;">【 Main Illustration 】</p>
                    <!-- ここにイラスト画像が入ります -->
                    <img src="images/top_illust.png" alt="メインイラスト" width="300" height="300" style="background:#eee;">
                </div>

            </div>

        </div>

        <!-- 【3】バナーエリア（フッター） -->
        <div id="footer-banner">
            <div class="banner-space">
                <!-- 相互リンクバナーなどを並べる場所 -->
                <img src="images/banner.gif" alt="バナー" width="200" height="40" style="background:#ddd;">
            </div>
            <p>(C) 2はは All Rights Reserved.</p>
        </div>

    </div>

</body>
</html>
