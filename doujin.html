    /* 1. ページ全体の背景（レトロ感のある淡い色や市松模様風の設定） */
    body {
        background-color: #e6eeff; /* 昔懐かしい淡いブルー系の背景色 */
        margin: 0;
        padding: 20px 0;
        font-family: "MS Pゴシック", sans-serif; /* 2000年代定番のフォント */
    }

    /* 2. サイト全体をまとめる中央の枠 */
    #wrapper {
        width: 800px;
        margin: 0 auto;
        background-color: #ffffff;
        border: 2px solid #6688cc; /* 外枠に線を引いてくっきりさせます */
    }

    /* 3. 上部のヘッダー領域 */
#header {
    background-color: #88aadd;
    text-align: center;
    line-height: 0; /* 画像の下にできる謎の数ピクセルの隙間を消すおまじない */
}

/* ヘッダー画像を枠幅（800px）にぴったり合わせる設定 */
#header img {
    width: 100%;
    height: auto;
    border: none; /* 昔のブラウザでリンク付き画像に出る青い枠線を消す */
}

    /* 4. メインコンテンツ（左メニュー＋右コンテンツ）の包み紙 */
    #container {
        display: flex; /* 左右に並べるための現代的な書き方 */
    }

    /* 5. 左側：メニュー（サイドバー） */
    #sidebar {
        width: 220px; /* 左メニューの幅 */
        background-color: #f0f4fb;
        padding: 10px;
        border-right: 1px solid #ccddee; /* 右側に境界線を引く */
    }

    /* 6. 右側：メインコンテンツ */
    #main {
        width: 580px; /* 800px - 220px = 580px */
        padding: 15px;
        box-sizing: border-box; /* パディングを含めた幅計算にする設定 */
    }

    /* 7. 一番下のフッター */
    #footer {
        background-color: #88aadd;
        color: #ffffff;
        text-align: center;
        padding: 8px;
        font-size: 12px;
        clear: both;
    }
  </style>
</head>
